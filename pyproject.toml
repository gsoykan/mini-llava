[project]
name = "mini-vlm"
version = "0.1.0"
description = "mini-VLM — LLaVA stage-1 connector training (CLIP + MLP + SmolLM2) on CIFAR-10"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Gurkan Soykan", email = "grkansoykan@gmail.com" }]

dependencies = [
    # --------- pytorch --------- #
    "torch>=2.10.0",
    "torchvision>=0.25.0",
    "lightning>=2.6.0",
    "torchmetrics>=1.8.0",
    # --------- hydra --------- #
    "hydra-core>=1.3.2",
    "hydra-colorlog>=1.2.0",
    "hydra-optuna-sweeper>=1.2.0",
    # --------- loggers --------- #
    "wandb>=0.24.0",
    # --------- others --------- #
    "rootutils>=1.0.7",
    "rich>=14.0",
    "python-dotenv>=1.0.0",
    "omegaconf>=2.3.0",
    "transformers>=5.8.1",
    "datasets>=4.8.5",
    "matplotlib>=3.10.9",
    "ipykernel>=7.2.0",
    "num2words>=0.5.14",
    "ipywidgets>=8.1.8",
    "accelerate>=1.13.0",
    "mlx-vlm>=0.5.0",
    "av>=17.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "sh>=2.2; sys_platform != 'win32'",
    "pre-commit>=4.5",
    "ruff>=0.15.0",
]

[project.scripts]
train = "src.train:main"
eval = "src.eval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --------- pytest --------- #
[tool.pytest.ini_options]
addopts = [
    "--color=yes",
    "--durations=0",
    "--strict-markers",
    "--doctest-modules",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
log_cli = true
markers = ["slow: slow tests"]
minversion = "6.0"
testpaths = "tests/"

# --------- coverage --------- #
[tool.coverage.report]
exclude_lines = [
    "pragma: nocover",
    "raise NotImplementedError",
    "raise NotImplementedError()",
    "if __name__ == .__main__.:",
]

# --------- ruff --------- #
[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "A",   # flake8-builtins
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "PT",  # flake8-pytest-style
    "RSE", # flake8-raise
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "S101",   # use of assert (needed in tests)
    "B008",   # do not perform function calls in argument defaults
    "RUF012", # mutable class attributes should be annotated with ClassVar
    "UP035",  # deprecated typing imports (some needed for compatibility)
    "RET504", # unnecessary assignment before return
    "N806",   # uppercase vars in functions — B/N/H/W/C are PyTorch tensor-shape conventions
    "N812",   # `import torch.nn.functional as F` — universal PyTorch idiom
    "RUF002", # ambiguous Unicode in docstrings — `×` reads better than `x` for dimensions
    "RUF003", # ambiguous Unicode in comments — same reason
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
